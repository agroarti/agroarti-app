<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АгроАрти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---------- Оформление (цвета и размеры) ---------- */
  :root{
    --bg:#05201a; --bg2:#0a3a2a; --card:rgba(255,255,255,.075); --line:rgba(255,255,255,.15);
    --text:#f2f8f4; --muted:#9fbcad; --gold:#ffcd50; --gold2:#e0a100; --green:#34c06f; --danger:#ff7a6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;
    background:radial-gradient(900px 420px at 85% -10%,rgba(255,176,52,.28),transparent 60%),
               linear-gradient(180deg,var(--bg2),var(--bg) 60%)}
  header{padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 9px,rgba(0,0,0,.10) 9px 12px);
    border-bottom:1px solid var(--line)}
  header svg{flex:none;filter:drop-shadow(0 0 10px rgba(255,190,60,.55))}
  .brand{font-weight:900;font-size:21px;line-height:1.1}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  main{flex:1;overflow-y:auto;padding:14px 16px 100px;-webkit-overflow-scrolling:touch}
  section{display:none;animation:in .25s ease}
  section.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin:18px 4px 9px}
  h2:first-child{margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-weight:700;font-size:16px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .warn{background:rgba(255,122,107,.14);border:1px solid rgba(255,122,107,.5);border-radius:14px;padding:11px;font-size:13.5px;margin-bottom:10px;line-height:1.4}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.5}
  /* переключатель */
  .sw{position:relative;width:54px;height:32px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
  .sw i{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.18);transition:.2s}
  .sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
  .sw input:checked + i{background:var(--green)}
  .sw input:checked + i::after{transform:translateX(22px)}
  /* время */
  .tpick{display:flex;align-items:center;justify-content:center;gap:10px}
  .tpick b{font-size:40px;color:var(--gold);font-weight:800}
  select,textarea,input.in{width:100%;font-size:17px;font-weight:600;color:var(--text);background:rgba(0,0,0,.28);
    border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;font-family:inherit;color-scheme:dark}
  textarea{resize:none;height:76px;font-weight:500}
  select:focus,textarea:focus,input.in:focus{border-color:var(--gold)}
  .tpick select{width:40%;font-size:42px;font-weight:800;color:var(--gold);text-align:center;text-align-last:center;
    -webkit-appearance:none;appearance:none;padding:8px 4px;border-radius:16px}
  /* кнопки-«чипы» */
  .chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .chip{min-width:0;text-align:center;padding:10px 0;border-radius:12px;background:rgba(255,255,255,.09);
    border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--gold);color:#2a2000;border-color:var(--gold)}
  .seg{display:grid;gap:6px}
  .seg.c4{grid-template-columns:repeat(4,1fr)} .seg.c2{grid-template-columns:repeat(2,1fr)}
  .seg .chip{padding:11px 4px;font-size:13px}
  .rcpt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);
    border:1px solid var(--line);margin-bottom:8px;cursor:pointer;user-select:none}
  .rcpt .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:15px;color:transparent}
  .rcpt.on{border-color:var(--green);background:rgba(52,192,111,.14)}
  .rcpt.on .box{background:var(--green);border-color:var(--green);color:#04210f}
  .rcpt .x{margin-left:auto;color:var(--danger);font-size:20px;padding:0 6px}
  .preview{font-size:14px;line-height:1.5;background:rgba(255,205,80,.10);border:1px dashed rgba(255,205,80,.5);border-radius:14px;padding:12px}
  .preview b{color:var(--gold)}
  /* кнопки */
  .btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16.5px;font-weight:800;color:#2a2000;font-family:inherit;
    background:linear-gradient(180deg,#ffd978,var(--gold2));box-shadow:0 8px 22px rgba(224,161,0,.3);cursor:pointer;margin-top:4px}
  .btn:disabled{opacity:.4;box-shadow:none}
  .btn2{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:15px;font-weight:700;color:var(--text);
    background:rgba(255,255,255,.09);font-family:inherit;cursor:pointer;margin-top:8px}
  .btn2.red{color:var(--danger);border-color:rgba(255,122,107,.5)}
  .btnrow{display:flex;gap:8px} .btnrow>*{flex:1}
  .small{padding:9px 12px;font-size:14px;width:auto;margin:0}
  /* журнал */
  .item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 40px 12px 14px;margin-bottom:9px}
  .item .top{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15.5px}
  .item .top span{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
  .item .line{font-size:14px;margin-top:4px;color:#e3efe8}
  .item .who{font-size:12.5px;color:var(--gold);margin-top:5px}
  .item .note{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .del{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);font-size:20px;padding:6px 9px;cursor:pointer}
  /* плитки расчётов */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:5px}
  .tile .ic{font-size:26px} .tile .t{font-weight:700;font-size:15px} .tile .d{font-size:11.5px;color:var(--muted);line-height:1.3}
  .tile.on{background:linear-gradient(160deg,rgba(255,205,80,.28),rgba(255,205,80,.08));border-color:var(--gold)}
  label.f{display:block;margin-bottom:10px}
  label.f span{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 5px}
  .result{margin-top:4px;padding:16px;border-radius:16px;text-align:center;background:linear-gradient(160deg,rgba(52,192,111,.25),rgba(52,192,111,.06));border:1px solid rgba(52,192,111,.5)}
  .result .big{font-size:32px;font-weight:900;color:var(--gold);line-height:1.1}
  .result .lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .result .ln{font-size:14px;margin-top:6px}
  .formula{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
  /* главная */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{padding:15px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
  .stat b{display:block;font-size:28px;color:var(--gold);font-weight:900}
  .stat span{font-size:12.5px;color:var(--muted)}
  /* окна снизу */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
  .sheet.on{display:flex}
  .sheet .body{width:100%;max-height:92%;overflow-y:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 12px;font-size:19px}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    background:rgba(5,32,26,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}
  nav button{flex:1;background:none;border:0;color:var(--muted);font-family:inherit;padding:5px 0;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-size:11px;font-weight:700;cursor:pointer}
  nav button span{font-size:21px;filter:grayscale(1) opacity(.7)}
  nav button.on{color:var(--gold)} nav button.on span{filter:none}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);opacity:0;
    background:#10261d;border:1px solid var(--gold);color:var(--text);padding:11px 16px;border-radius:14px;font-size:14px;
    max-width:88%;text-align:center;pointer-events:none;transition:.25s;z-index:30}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <svg id="logo" width="42" height="42" viewBox="0 0 64 64" aria-hidden="true"></svg>
  <div>
    <div class="brand">АгроАрти</div>
    <div class="sub" id="who">Смарт-помощник агронома</div>
  </div>
</header>

<main>
  <section id="tab-home" class="on"></section>
  <section id="tab-journal"></section>
  <section id="tab-calc"></section>
  <section id="tab-reports"></section>
  <section id="tab-profile"></section>
</main>

<nav>
  <button data-tab="home" class="on" onclick="showTab('home')"><span>🏠</span>Главная</button>
  <button data-tab="journal" onclick="showTab('journal')"><span>📖</span>Журнал</button>
  <button data-tab="calc" onclick="showTab('calc')"><span>🧮</span>Расчёты</button>
  <button data-tab="reports" onclick="showTab('reports')"><span>📤</span>Отчёты</button>
  <button data-tab="profile" onclick="showTab('profile')"><span>👤</span>Профиль</button>
</nav>

<!-- Окно: добавить дело -->
<div class="sheet" id="sheetWork"><div class="body">
  <h3>Новое дело</h3>
  <label class="f"><span>Дата</span><input class="in" type="date" id="wDate"></label>
  <label class="f"><span>Поле или участок *</span><input class="in" id="wField" maxlength="40" list="listFields" placeholder="Например: Поле №3"></label>
  <datalist id="listFields"></datalist>
  <label class="f"><span>Культура</span><input class="in" id="wCrop" maxlength="40" list="listCrops" placeholder="Например: пшеница"></label>
  <datalist id="listCrops"></datalist>
  <label class="f"><span>Вид работ *</span><select id="wType" onchange="workTypeChanged()"></select></label>
  <label class="f" id="wOtherBox" style="display:none"><span>Свой вид работ</span><input class="in" id="wOther" maxlength="40"></label>
  <label class="f"><span>Площадь, га</span><input class="in" id="wArea" inputmode="decimal" placeholder="Например: 15,5"></label>
  <label class="f"><span>Примечание (техника, орудие, расход)</span><textarea id="wNote" maxlength="200"></textarea></label>
  <div class="btnrow">
    <button class="btn2" onclick="closeSheet('sheetWork')">Отмена</button>
    <button class="btn" style="margin:8px 0 0" onclick="saveWork()">Сохранить</button>
  </div>
</div></div>

<!-- Окно: очистка -->
<div class="sheet" id="sheetClear"><div class="body">
  <h3>🧹 Очистка</h3>
  <div class="hint" style="margin:-6px 0 8px">Ничего не пропадает навсегда сразу: убранное хранится 30 дней и возвращается кнопкой «Вернуть удалённое».</div>
  <button class="btn2" onclick="askClear('works','last')">↩️ Убрать последнее дело</button>
  <button class="btn2" onclick="askClear('calcs','last')">↩️ Убрать последний расчёт</button>
  <button class="btn2 red" onclick="askClear('works','all')">🗂 Очистить журнал дел</button>
  <button class="btn2 red" onclick="askClear('calcs','all')">🧮 Очистить расчёты</button>
  <button class="btn2" id="btnUndo" onclick="undoClear()">♻️ Вернуть удалённое</button>
  <button class="btn2" onclick="closeSheet('sheetClear')">Закрыть</button>
</div></div>

<!-- Окно: знакомство (ФИО) -->
<div class="sheet" id="sheetName"><div class="body">
  <h3>Как вас зовут?</h3>
  <div class="hint" style="margin:-6px 0 12px">Введите ФИО полностью. Оно будет стоять рядом с каждой записью журнала и в Excel-отчётах.</div>
  <label class="f"><span>Фамилия Имя Отчество</span><input class="in" id="fioFirst" maxlength="80" placeholder="Иванов Пётр Сергеевич"></label>
  <button class="btn" onclick="saveFio(true)">Продолжить</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  КАК УСТРОЕН ЭТОТ ФАЙЛ
//  1. Общие мелочи (даты, числа, уведомления)
//  2. Хранилище: где приложение держит данные
//  3. Работа с записями: добавить, убрать, вернуть
//  4. Экраны: главная, журнал, расчёты, отчёты, профиль
//  5. Отправка данных боту (отчёт или настройки)
//  6. Запуск
//  Данные хранятся в самом приложении (в облаке Telegram и на телефоне).
//  Бот получает их только когда вы нажимаете кнопки «Отправить» или «Сохранить».
// =====================================================================


// ---------------------------------------------------------------------
//  1. ОБЩЕЕ
// ---------------------------------------------------------------------
var tg = window.Telegram ? window.Telegram.WebApp : null;     // объект Telegram (в обычном браузере его нет)
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#05201a"); tg.setBackgroundColor("#05201a"); } catch (e) {} }

function $(selector) { return document.querySelector(selector); }      // короткая запись для поиска элемента на странице
function pad(n) { return (n < 10 ? "0" : "") + n; }                    // 5 -> "05"
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }   // дата -> "2026-11-25"
function todayISO() { return isoDate(new Date()); }
function daysAgoISO(n) { var d = new Date(); d.setDate(d.getDate() - n); return isoDate(d); }
function ruDate(iso) { return iso.substr(8, 2) + "." + iso.substr(5, 2) + "." + iso.substr(0, 4); }      // "2026-11-25" -> "25.11.2026"
function esc(text) {                                                    // защита: превращаем <, >, & в безопасные символы
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
var nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
function num(x) { return nf.format(x); }                                // 135000 -> "135 000"
function rub(x) { return num(x) + " ₽"; }

var toastTimer;
function toast(text) {                                                  // всплывающее сообщение сверху
  var t = $("#toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2600);
}
function haptic() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }   // лёгкая вибрация при нажатии

function ask(text, yes) {                                               // вопрос «Вы уверены?»; если «да», выполняем функцию yes
  if (tg && tg.showConfirm) { tg.showConfirm(text, function (ok) { if (ok) { yes(); } }); }
  else if (confirm(text)) { yes(); }
}
function openSheet(id) { $("#" + id).classList.add("on"); }
function closeSheet(id) { $("#" + id).classList.remove("on"); }

// Логотип-колос
(function () {
  var g = "";
  for (var k = 0; k < 5; k++) {
    var y = 46 - k * 8, s = 1 - k * 0.07;
    g += '<ellipse cx="' + (32 - 6 * s) + '" cy="' + y + '" rx="' + 4.6 * s + '" ry="' + 9 * s + '" transform="rotate(-32 ' + (32 - 6 * s) + ' ' + y + ')"/>';
    g += '<ellipse cx="' + (32 + 6 * s) + '" cy="' + y + '" rx="' + 4.6 * s + '" ry="' + 9 * s + '" transform="rotate(32 ' + (32 + 6 * s) + ' ' + y + ')"/>';
  }
  g += '<ellipse cx="32" cy="8.5" rx="4.4" ry="9.5"/>';
  $("#logo").innerHTML = '<line x1="32" y1="62" x2="32" y2="30" stroke="#7ec36a" stroke-width="2.6" stroke-linecap="round"/><g fill="#ffcd50" stroke="#c98a00" stroke-width=".8">' + g + '</g>';
})();


// ---------------------------------------------------------------------
//  2. ХРАНИЛИЩЕ
// ---------------------------------------------------------------------
//  DB - это главный объект с данными приложения:
//    DB.fio     - ФИО
//    DB.works   - журнал работ (список)
//    DB.calcs   - сохранённые расчёты (список)
//    DB.clears  - что и когда убирали (для кнопки «Вернуть удалённое»)
//    DB.sync    - когда данные последний раз отправляли боту
//    DB.sched   - настройки ежедневной рассылки
//  Хранится DB в облаке Telegram (CloudStorage), а копия лежит на телефоне (localStorage).

var DB = null;
var CHUNK = 2500;      // облако хранит строки до ~4000 символов, поэтому режем данные на куски

function newDB() {
  return {
    fio: "", seq: 0, saved: 0, works: [], calcs: [], clears: [],
    sync: { at: "", changes: 0 },
    sched: { on: false, time: "18:00", days: [0, 1, 2, 3, 4, 5, 6], period: "day", fmt: "excel", targets: ["me"] }
  };
}

function fixDB(obj) {                 // если в сохранённых данных чего-то не хватает, добавляем недостающее
  var base = newDB();
  for (var key in base) { if (obj[key] === undefined) { obj[key] = base[key]; } }
  return obj;
}

function cloudOK() { return !!(tg && tg.CloudStorage && tg.CloudStorage.setItem); }

function saveDB() {
  DB.saved = Date.now();
  var text = JSON.stringify(DB);                        // объект -> текст
  try { localStorage.setItem("agroarti_db", text); } catch (e) {}      // копия на телефоне
  if (cloudOK()) {                                      // копия в облаке Telegram (по кускам)
    var n = Math.ceil(text.length / CHUNK);
    for (var i = 0; i < n; i++) { tg.CloudStorage.setItem("db" + i, text.substr(i * CHUNK, CHUNK)); }
    tg.CloudStorage.setItem("dbn", String(n));
  }
}

function readLocal() {
  try { var t = localStorage.getItem("agroarti_db"); if (t) { return fixDB(JSON.parse(t)); } } catch (e) {}
  return null;
}

function loadDB(done) {               // читаем данные и вызываем done(), когда они готовы
  var local = readLocal();
  var finished = false;
  function finish(obj) {              // выбираем итоговые данные и идём дальше (один раз)
    if (finished) { return; }
    finished = true;
    DB = obj || local || newDB();
    done();
  }
  if (!cloudOK()) { finish(local); return; }
  setTimeout(function () { finish(local); }, 2500);          // если облако долго молчит, берём копию с телефона
  tg.CloudStorage.getItem("dbn", function (err, value) {
    var n = parseInt(value || "0", 10);
    if (!n) { finish(local); return; }
    var keys = [];
    for (var i = 0; i < n; i++) { keys.push("db" + i); }
    tg.CloudStorage.getItems(keys, function (err2, values) {
      var text = "";
      for (var j = 0; j < n; j++) { text += (values && values["db" + j]) || ""; }
      var remote = null;
      try { remote = fixDB(JSON.parse(text)); } catch (e) {}
      if (remote && local) { finish(remote.saved >= local.saved ? remote : local); }     // берём более свежие
      else { finish(remote || local); }
    });
  });
}


// ---------------------------------------------------------------------
//  3. РАБОТА С ЗАПИСЯМИ
// ---------------------------------------------------------------------
//  Запись журнала: {id, date, field, crop, type, area, note, worker, del}
//  Запись расчёта: {id, date, kind, values, label, worker, del}
//  del == null  - запись активна;  del == {at, batch}  - запись убрана (её можно вернуть)

function activeList(list) {            // список записей, которые не убраны, по порядку дат
  var out = [];
  for (var i = 0; i < list.length; i++) { if (!list[i].del) { out.push(list[i]); } }
  out.sort(function (a, b) { if (a.date !== b.date) { return a.date < b.date ? -1 : 1; } return a.id - b.id; });
  return out;
}

function changed() { DB.sync.changes = DB.sync.changes + 1; }       // считаем, сколько изменений ещё не отправлено боту

function newId() { DB.seq = DB.seq + 1; return DB.seq; }

function removeRecords(kind, mode) {   // kind: "works" или "calcs"; mode: "last" (одну) или "all" (все)
  var items = activeList(DB[kind]);
  if (items.length === 0) { toast("Здесь пока пусто"); return; }
  var targets = (mode === "last") ? [items[items.length - 1]] : items;
  var batch = newId();
  var at = new Date().toISOString();
  for (var i = 0; i < targets.length; i++) { targets[i].del = { at: at, batch: batch }; }
  DB.clears.push({ id: batch, at: at, n: targets.length, kind: kind });
  changed(); saveDB(); renderAll();
  toast("Убрано записей: " + targets.length + ". Вернуть можно в «Очистке»");
}

function undoClear() {                 // возвращает последнюю убранную группу записей
  if (DB.clears.length === 0) { toast("Нечего возвращать"); return; }
  var last = DB.clears.pop();
  var lists = [DB.works, DB.calcs];
  for (var a = 0; a < lists.length; a++) {
    for (var i = 0; i < lists[a].length; i++) {
      if (lists[a][i].del && lists[a][i].del.batch === last.id) { lists[a][i].del = null; }
    }
  }
  changed(); saveDB(); renderAll(); updateUndoButton();
  toast("Возвращено записей: " + last.n);
}

function purgeOld() {                  // навсегда стираем то, что убрано больше 30 дней назад
  var limit = Date.now() - 30 * 24 * 3600 * 1000;
  var lists = ["works", "calcs"];
  for (var a = 0; a < lists.length; a++) {
    var keep = [];
    for (var i = 0; i < DB[lists[a]].length; i++) {
      var r = DB[lists[a]][i];
      if (!(r.del && new Date(r.del.at).getTime() < limit)) { keep.push(r); }
    }
    DB[lists[a]] = keep;
  }
  var keepClears = [];
  for (var j = 0; j < DB.clears.length; j++) { if (new Date(DB.clears[j].at).getTime() >= limit) { keepClears.push(DB.clears[j]); } }
  DB.clears = keepClears;
}

function askClear(kind, mode) {        // спрашиваем подтверждение и убираем
  var what = (kind === "works" ? "журнал дел" : "расчёты");
  var text = (mode === "last") ? "Убрать последнюю запись? Её можно будет вернуть." : "Очистить " + what + "? Записи можно будет вернуть в течение 30 дней.";
  ask(text, function () { removeRecords(kind, mode); closeSheet("sheetClear"); });
}

function updateUndoButton() {

  btn.style.opacity = DB.clears.length === 0 ? 0.4 : 1;
}

function inPeriod(iso, period) {       // попадает ли дата в период
  if (period === "all") { return true; }
  if (period === "day") { return iso === todayISO(); }
  if (period === "week") { return iso >= daysAgoISO(6) && iso <= todayISO(); }
  if (period === "month") { return iso.substr(0, 7) === todayISO().substr(0, 7); }
  if (period === "snap") { return iso >= daysAgoISO(62); }      // для автоотчёта храним в боте последние ~2 месяца
  return true;
}

function countIn(list, period) {
  var n = 0;
  for (var i = 0; i < list.length; i++) { if (inPeriod(list[i].date, period)) { n++; } }
  return n;
}
function areaIn(period) {
  var sum = 0, items = activeList(DB.works);
  for (var i = 0; i < items.length; i++) { if (inPeriod(items[i].date, period) && items[i].area) { sum += items[i].area; } }
  return sum;
}

function readValues() {
  var inputs = $("#tab-calc").querySelectorAll("input.num"), v = [];
  for (var i = 0; i < inputs.length; i++) {
    var t = inputs[i].value.replace(",", ".").trim();
    v.push(t === "" ? NaN : Number(t));
  }
  return v;
}

function recalc() {                      // пересчитываем результат при каждом нажатии клавиши
  var v = readValues(), ok = true;
  for (var i = 0; i < v.length; i++) { if (!isFinite(v[i]) || v[i] < 0) { ok = false; } }
  var r = ok ? CALCS[current].fn(v) : null;
  $("#btnSaveCalc").disabled = !r;
  if (r) {
    var h = '<div class="lbl">' + r.lbl + '</div><div class="big">' + r.big + '</div>';
    for (var j = 0; j < r.lines.length; j++) { h += '<div class="ln">' + r.lines[j] + '</div>'; }
    h += '<div class="formula">Формула: ' + r.formula + '</div>';
    $("#result").innerHTML = h;
  } else {
    $("#result").innerHTML = '<div class="lbl">Заполните все поля, и результат появится здесь</div>';
  }
}

function saveCalc() {
  var v = readValues();

  h += '<div class="card"><div class="hint" style="margin:0 2px 8px">Кому отправлять</div>' + targetsHtml(s.targets, "schedTarget") + '</div>';
  var names = targetNames();
  var dayText = s.days.length === 7 ? "каждый день" : (s.days.length ? "по " + s.days.slice().sort().map(function (i) { return DAYS[i]; }).join(", ") : "дни не выбраны");
  var toText = s.targets.map(function (t) { return names[t]; }).filter(Boolean).join(", ") || "получатели не выбраны";
  h += '<div class="preview">' + (s.on ? 'Бот отправит <b>' + FORMATS[s.fmt] + '</b> ' + PERIOD_TXT[s.period] + ': <b>' + dayText + '</b> в <b>' + s.time + '</b> → ' + toText + '.'
                                     : 'Автоотчёт <b>выключен</b>. Включите переключатель выше.') + '</div>';
  h += '<button class="btn" onclick="saveToBot()">💾 Сохранить настройки</button>';
  h += '<div class="hint" style="margin:8px 4px">Автоотчёт берёт данные, которые вы отправили боту в последний раз. Нажимайте «Сохранить» после работы.</div>';
  $("#tab-reports").innerHTML = h;
}

function timeOptions(count, selected) {
  var h = "";
  for (var i = 0; i < count; i++) { h += '<option' + (pad(i) === selected ? " selected" : "") + '>' + pad(i) + '</option>'; }
  return h;
}
function toggleIn(list, value) { var i = list.indexOf(value); if (i === -1) { list.push(value); } else { list.splice(i, 1); } }

function nowPeriod(v) { NOW.period = v; renderReports(); }
function nowFmt(v) { NOW.fmt = v; renderReports(); }
function nowTarget(id) { toggleIn(NOW.targets, id); renderReports(); }
function schedOn(checked) { DB.sched.on = checked; saveDB(); renderAll(); }
function schedTime() { DB.sched.time = $("#sHH").value + ":" + $("#sMM").value; saveDB(); renderHome(); }
function toggleDay(d) { toggleIn(DB.sched.days, d); saveDB(); renderReports(); }
function schedPeriod(v) { DB.sched.period = v; saveDB(); renderReports(); }
function schedFmt(v) { DB.sched.fmt = v; saveDB(); renderReports(); }
function schedTarget(id) { toggleIn(DB.sched.targets, id); saveDB(); renderReports(); }

// ----- Профиль -----
function renderProfile() {
  var h = '<h2>Ваше ФИО</h2><div class="card"><label class="f"><span>Фамилия Имя Отчество</span>';
  h += '<input class="in" id="fioEdit" maxlength="80" value="' + esc(DB.fio) + '" placeholder="Иванов Пётр Сергеевич"></label>';
  h += '<div class="hint">ФИО записывается в новые дела и расчёты. Старые записи не меняются.</div>';
  h += '<button class="btn" onclick="saveFio(false)">Сохранить ФИО</button></div>';

  h += '<h2>Подключённые чаты</h2><div class="card">';
  if (GROUPS.length === 0) { h += '<div class="hint" style="margin:0">Чатов пока нет.</div>'; }
  for (var i = 0; i < GROUPS.length; i++) {
    h += '<div class="rcpt" style="cursor:default"><div class="title">' + esc(GROUPS[i].n) + '</div><span class="x" onclick="removeGroup(\'' + GROUPS[i].i + '\')">✕</span></div>';
  }
  h += '<div class="hint" style="margin-top:10px">Как подключить чат: создайте группу, добавьте туда бота и напишите в ней <b>/connect Название</b>. ' +
       'Затем откройте приложение заново. Убрать чат: нажмите ✕ и сохраните настройки на вкладке «Отчёты».</div></div>';

  h += '<h2>О приложении</h2><div class="card"><div class="title">АгроАрти</div>';
  h += '<div class="hint">Смарт-помощник агронома: журнал полевых работ, расчёты, Excel-отчёты и ежедневная рассылка. ' +
       'Ваши данные хранятся в облаке Telegram и на этом телефоне.</div></div>';
  $("#tab-profile").innerHTML = h;
}

function saveFio(first) {
  var text = (first ? $("#fioFirst").value : $("#fioEdit").value).trim().replace(/\s+/g, " ");
  var words = text.split(" ");
  if (text.length < 3 || words.length < 2 || !/^[A-Za-zА-Яа-яЁё\-\. ]+$/.test(text)) { toast("Напишите минимум фамилию и имя буквами"); return; }
  var out = [];
  for (var i = 0; i < words.length; i++) { out.push(words[i].charAt(0).toUpperCase() + words[i].slice(1)); }
  DB.fio = out.join(" ");
  saveDB(); changed(); closeSheet("sheetName"); renderAll();
  toast("ФИО сохранено");
}

function removeGroup(id) {
  ask("Убрать этот чат из списка? Изменение вступит в силу после сохранения настроек.", function () {
    var keep = [];
    for (var i = 0; i < GROUPS.length; i++) { if (GROUPS[i].i !== id) { keep.push(GROUPS[i]); } }
    GROUPS = keep;
    NOW.targets = NOW.targets.filter(function (t) { return t !== id; });
    DB.sched.targets = DB.sched.targets.filter(function (t) { return t !== id; });
    saveDB(); renderAll();
  });
}


// ---------------------------------------------------------------------
//  5. ОТПРАВКА ДАННЫХ БОТУ
// ---------------------------------------------------------------------
//  Telegram позволяет отправить боту не больше 4096 байт, поэтому записи сначала
//  превращаем в короткий текст и сжимаем. Если всё равно много, отправляем самые свежие.
//  После отправки приложение закрывается (так устроен Telegram).

function compress(text, done) {
  if (window.CompressionStream && window.Response && window.Blob) {
    try {
      var stream = new Blob([text]).stream().pipeThrough(new CompressionStream("deflate"));
      new Response(stream).arrayBuffer().then(function (buffer) {
        var bytes = new Uint8Array(buffer), bin = "";
        for (var i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
        done({ z: 1, d: btoa(bin) });                     // сжатый текст
      }, function () { done({ z: 0, d: text }); });
      return;
    } catch (e) {}
  }
  done({ z: 0, d: text });                                // сжать не получилось: отправляем как есть
}

function byteSize(text) { return new TextEncoder().encode(text).length; }

function makePack(works, calcs, trimmed, done) {          // works и calcs - короткие списки записей
  compress(JSON.stringify({ w: works, c: calcs }), function (res) {
    if (byteSize(res.d) > 3000 && works.length + calcs.length > 1) {
      works = works.slice(Math.max(works.length > 0 ? 1 : 0, Math.floor(works.length * 0.25)));    // выбрасываем самые старые
      calcs = calcs.slice(Math.max(calcs.length > 0 ? 1 : 0, Math.floor(calcs.length * 0.25)));
      makePack(works, calcs, true, done);
    } else { done(res, trimmed); }
  });
}

function sendToBot(kind, extra, period) {                 // kind: "save" или "report"; period: какие записи отправлять
  var works = [], calcs = [], aw = activeList(DB.works), ac = activeList(DB.calcs), i;
  for (i = 0; i < aw.length; i++) {
    if (inPeriod(aw[i].date, period)) { works.push([aw[i].date, aw[i].field, aw[i].crop, aw[i].type, aw[i].area, aw[i].note, aw[i].worker || DB.fio]); }
  }
  for (i = 0; i < ac.length; i++) {
    if (inPeriod(ac[i].date, period)) { calcs.push([ac[i].date, ac[i].kind, ac[i].values, ac[i].label, ac[i].worker || DB.fio]); }
  }
  makePack(works, calcs, false, function (res, trimmed) {
    var payload = { t: kind, fio: DB.fio, z: res.z, d: res.d };
    if (trimmed) { payload.trimmed = true; }
    for (var key in extra) { payload[key] = extra[key]; }
    if (!tg || !tg.sendData) { toast("Откройте приложение большой кнопкой в чате с ботом"); console.log(payload); return; }
    try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    tg.sendData(JSON.stringify(payload));
  });
}

function groupIds() { var ids = []; for (var i = 0; i < GROUPS.length; i++) { ids.push(GROUPS[i].i); } return ids; }

function saveToBot() {                                    // «Сохранить и отправить в бота»: настройки + свежие записи
  var s = DB.sched;
  if (s.on && s.days.length === 0) { toast("Выберите хотя бы один день недели"); return; }
  if (s.on && s.targets.length === 0) { toast("Выберите хотя бы одного получателя"); return; }
  var d = new Date();
  DB.sync = { at: ruDate(todayISO()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()), changes: 0 };
  saveDB();
  sendToBot("save", { on: s.on, time: s.time, days: s.days.slice().sort(), period: s.period, fmt: s.fmt, targets: s.targets, groups: groupIds() }, "snap");
}

function sendNow() {
  if (NOW.targets.length === 0) { toast("Выберите хотя бы одного получателя"); return; }
  var n = countIn(activeList(DB.works), NOW.period) + countIn(activeList(DB.calcs), NOW.period);
  if (n === 0) { toast("За этот период записей нет"); return; }
  sendToBot("report", { period: NOW.period, fmt: NOW.fmt, targets: NOW.targets }, NOW.period);
}


// ---------------------------------------------------------------------
//  6. ЗАПУСК
// ---------------------------------------------------------------------
function readParam() {                  // бот передаёт в адресе список чатов и настройки рассылки
  try {
    var raw = new URLSearchParams(location.search).get("d");
    if (!raw) { return null; }
    var b = raw.replace(/-/g, "+").replace(/_/g, "/"), pad4 = "=".repeat((4 - b.length % 4) % 4);
    var bin = atob(b + pad4), bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  } catch (e) { return null; }
}

loadDB(function () {
  var P = readParam();
  if (P) {
    GROUPS = P.groups || [];
    if (P.sched) { DB.sched = P.sched; }                  // настройки из бота главнее
  }
  NOW.targets = ["me"];
  purgeOld();
  saveDB();
  renderAll();
  if (!DB.fio) {                                          // первый запуск: спрашиваем ФИО
    try { var u = tg.initDataUnsafe.user; $("#fioFirst").value = (u.last_name ? u.last_name + " " : "") + u.first_name; } catch (e) {}
    openSheet("sheetName");
  }
});
</script>
